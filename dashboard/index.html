<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-token Radar: protocols ranked by implied launch value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="masthead">
  <div class="masthead-text">
    <p class="kicker">Implied value at launch &middot; built from the snapshot alone</p>
    <h1>Pre-token Radar</h1>
    <p class="dateline" id="dateline">Loading the snapshot.</p>
  </div>
  <dl class="facts" id="facts"></dl>
</header>

<section class="toolbar" aria-label="Filters and sorting">
  <label class="field grow">
    <span>Find</span>
    <input id="q" type="search" placeholder="protocol, category or chain" autocomplete="off">
  </label>
  <label class="field">
    <span>Category</span>
    <select id="cat"><option value="all">Every category</option></select>
  </label>
  <label class="field">
    <span>Chain</span>
    <select id="chain"><option value="all">Every chain</option></select>
  </label>
  <label class="field">
    <span>Order</span>
    <select id="sort">
      <option value="rank">Rank</option>
      <option value="tvl">TVL</option>
      <option value="growth">7-day change</option>
      <option value="age">Days without a token</option>
      <option value="name">Name</option>
    </select>
  </label>
  <label class="toggle"><input id="watch" type="checkbox"><span>Watchlist only</span></label>
  <label class="toggle"><input id="live" type="checkbox"><span>Token-bearing set</span></label>
</section>

<main class="desk">
  <section class="board" aria-label="Ranked board">
    <div class="board-head">
      <h2 id="board-title">The board</h2>
      <p id="board-note" class="note"></p>
    </div>
    <div class="table-wrap">
      <table id="table">
        <thead><tr id="head-row"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </section>

  <aside class="detail" id="detail" aria-live="polite"></aside>
</main>

<footer class="foot">
  <p id="footnote"></p>
</footer>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
